prefix: ab
backend: vault
vault:
  root: docs
  type_property: type
  tickets:
    feature:
      ticket_type: epic
      statuses:
        todo: open
        active: in_progress
        done: completed
    task:
      ticket_type: task
      statuses:
        todo: open
        active: in_progress
        done: completed
      fields:
        depends_on: dependencies
        feature: parent
  docs:
    idea:
      statuses: [open]
      template: templates/idea.md
  criteria_heading: Acceptance criteria
  files_heading: Files
  ticket_templates:
    feature: templates/feature.md
    task: templates/task.md
  ticket_directories:
    feature: .
    task: tasks
  required_sections:
    feature: [Description, Acceptance criteria]
    task: [Description, Files, Acceptance criteria]
